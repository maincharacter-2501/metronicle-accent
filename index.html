<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f4"><title>Metronicle — Accent Editor</title><style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#171717;background:#f7f7f4}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px}.panel{width:min(100%,560px);border:1.5px solid #171717;border-radius:16px;padding:clamp(18px,5vw,32px);background:#fff}.eyebrow{font-size:12px;letter-spacing:.15em;color:#666}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 26px}.heading h1{font-size:19px;letter-spacing:.025em;margin:6px 0 0}.select{border:1px solid #aaa;background:white;border-radius:8px;padding:9px;font:inherit;color:inherit}.beats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(3px,1vw,9px);margin:24px 0 14px}.beat{color:#171717;border:0;background:transparent;padding:5px 0;cursor:pointer;touch-action:manipulation;min-width:0;border-radius:8px}.beat:focus-visible{outline:2px solid #111;outline-offset:2px}.beat svg{width:100%;height:auto;aspect-ratio:1/1;max-width:54px;display:block;margin:auto;overflow:visible;color:#171717}.beat .num{display:block;text-align:center;font-size:11px;margin-top:4px;color:#777}.beat.hidden{visibility:hidden}.instructions{font-size:12px;color:#666;text-align:center;min-height:20px;margin:10px 0 24px}.controls{display:flex;gap:10px;flex-wrap:wrap}.control{flex:1;min-width:110px;border:1px solid #111;border-radius:8px;background:white;color:#111;padding:12px;font:inherit;cursor:pointer}.control.primary{background:#171717;color:#fff}.control:focus-visible{outline:2px solid #666;outline-offset:3px}.status{margin-top:20px;border-top:1px solid #ddd;padding-top:15px;display:flex;justify-content:space-between;gap:10px;color:#555;font-size:12px}.note{margin-top:16px;font-size:11px;color:#888;text-align:center}@media(max-width:390px){.panel{padding:14px}.beat svg{max-width:42px}.control{min-width:90px}}
</style></head><body><main class="panel"><header class="heading"><div><div class="eyebrow">METRONICLE / UI PROTOTYPE</div><h1>ACCENT EDITOR</h1></div><label><span class="eyebrow">METER</span><br><select class="select" id="meter" aria-label="拍子"><option>1/4</option><option>2/4</option><option>3/4</option><option>4/4</option><option>5/4</option><option>6/8</option><option selected>7/8</option></select></label></header><div class="beats" id="beats" aria-label="アクセント設定"></div><p class="instructions">○ をタップして ◎ に切り替え</p><div class="controls"><button class="control primary" id="step">次の拍へ →</button><button class="control" id="reset">再生位置を戻す</button></div><div class="status"><span id="status">7/8 · 0 / 7</span><span id="accents">ACCENT: 1, 3, 5</span></div><p class="note">タップでアクセントを変更。経過した拍は黒く表示されます。</p></main><script>
const meter=document.querySelector('#meter'),beats=document.querySelector('#beats'),status=document.querySelector('#status'),accentsLabel=document.querySelector('#accents');let count=7,accent=new Set([0,2,4]),played=0;function render(){beats.replaceChildren();for(let i=0;i<count;i++){const b=document.createElement('button');b.type='button';b.className='beat';b.setAttribute('aria-label',`${i+1}拍目 ${accent.has(i)?'アクセントあり':'アクセントなし'} ${i<played?'経過済み':''}`);b.setAttribute('aria-pressed',String(accent.has(i)));const double=accent.has(i),filled=i<played;b.innerHTML=`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="${double?19:14}" fill="none" stroke="#171717" stroke-width="2.5"/>${double?'<circle cx="24" cy="24" r="12" fill="'+(filled?'#171717':'none')+'" stroke="#171717" stroke-width="2.5"/>':(filled?'<circle cx="24" cy="24" r="14" fill="#171717"/>':'')}</svg><span class="num">${i+1}</span>`;b.addEventListener('click',()=>{accent.has(i)?accent.delete(i):accent.add(i);render()});beats.append(b)}status.textContent=`${meter.value} · ${played} / ${count}`;accentsLabel.textContent='ACCENT: '+([...accent].sort((a,b)=>a-b).map(i=>i+1).join(', ')||'OFF')};meter.addEventListener('change',()=>{count=parseInt(meter.value,10);accent=new Set([0]);played=0;render()});document.querySelector('#step').addEventListener('click',()=>{played=(played+1)%(count+1);render()});document.querySelector('#reset').addEventListener('click',()=>{played=0;render()});render();
</script></body></html>
