<nav><button id="again">最初から</button><button id="skip">全文表示</button></nav><small id="status">「！」をタップして開始</small>
<script>
const scripts={
wend:['（この おきてを やぶる ときが きた','あなたを むねに いだいたまま','わたしは もう どこへだって いける。）'],
mirathea:['「みちたり かけたり おつきさま','くだけて やどる おほしさま','おひさま いちど だませたら','いつまでも ふたりきり。」']};
let who='wend',id=0;const el=x=>document.getElementById(x);const wait=ms=>new Promise(r=>setTimeout(r,ms));
const canvas=el('text'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
let shown=[];
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000';ctx.textBaseline='top';
  ctx.font='bold 11px "MS Gothic","ＭＳ ゴシック","Noto Sans Mono CJK JP",monospace';
  const step=17,top=Math.floor((canvas.height-scripts[who].length*step)/2);
  // Keep every supplied line intact. Compress width uniformly only if needed.
  const maxWidth=Math.max(...scripts[who].map(line=>ctx.measureText(line).width));
  const scale=Math.min(1,(canvas.width-12)/maxWidth);
  ctx.save();ctx.translate(6,0);ctx.scale(scale,1);
  shown.forEach((line,i)=>ctx.fillText(line,0,top+i*step));
  ctx.restore();
  canvas.setAttribute('aria-label',shown.join(' / '));
}
el('mini-witch').src=el('witch').src;
el('mini-wend').src=el('wolf').src;
function syncMini(){for(const name of ['witch','wend']){const mini=el('mini-'+name);mini.classList.remove('active');mini.style.display=(who==='mirathea' ? name==='witch' : name==='wend')?'block':'none';}}
function reset(){syncMini();el('bang').style.visibility='visible';el('witch').style.display=who==='mirathea'?'block':'none';el('wolf').style.display=who==='wend'?'block':'none';id++;el('scene').style.opacity='1';el('veil').style.opacity='0';el('overlay').style.opacity='0';shown=scripts[who].map(()=>'');draw();el('status').textContent='「！」をタップして開始';el('bang').disabled=false}
function full(){syncMini();el(who==='mirathea'?'mini-witch':'mini-wend').classList.add('active');id++;el('scene').style.opacity='0';el('bang').style.visibility='hidden';el('veil').style.opacity='1';el('overlay').style.opacity='1';shown=[...scripts[who]];draw();el('status').textContent='表示完了'}
async function play(){reset();const run=++id;el('bang').disabled=true;el('bang').style.visibility='hidden';el('status').textContent='フェードアウト中';for(let n=0;n<=25;n++){if(run!==id)return;el('veil').style.opacity=String(n/25);await wait(26)}el('scene').style.opacity='0';await wait(800);if(run!==id)return;el('overlay').style.opacity='1';{el(who==='mirathea'?'mini-witch':'mini-wend').classList.add('active');el('status').textContent=who==='mirathea'?'ミラテア登場':'WEND登場';await wait(700);if(run!==id)return;}el('status').textContent='文字表示中';for(let i=0;i<scripts[who].length;i++){for(const char of scripts[who][i]){if(run!==id)return;shown[i]+=char;draw();if(char!==' ' && char!=='　')await wait(150)}if(i<scripts[who].length-1)await wait(400)}if(run===id)el('status').textContent='表示完了'}
el('bang').onclick=play;el('again').onclick=play;el('skip').onclick=full;
document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{who=b.dataset.who;document.querySelectorAll('[data-who]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset()});
reset();</script></body></html>
